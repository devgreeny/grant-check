<meta charset="utf-8">
<title>Grant Coding Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Roboto:wght@400;500;700&display=swap">
<style>
/* Demo: one invoice, one button, the trace, the answer. Full version (evals, reviewer tools) is in archive/. */
:root {
  --ground: #EEF1F5; --paper: #FFFFFF; --panel: #F5F7FA; --ink: #1B2430; --soft: #5A6573; --rule: #D6DCE4;
  --navy: #003366; --navy-deep: #1C3664; --on-navy: #FFFFFF; --on-navy-soft: #B9C8DC;
  --blue: #0074A6; --blue-tint: #E3F1F8;
  --c-rule: #0074A6; --c-rule-t: #E3F1F8; --c-vet: #6B3FA0; --c-vet-t: #EFE8F7; --c-check: #4A5868; --c-check-t: #E9EDF2; --c-claude: #1C3664; --c-claude-t: #E1E8F3; --c-pivot: #8A5D00; --c-pivot-t: #FBF0D5;
  --gold: #E9B732; --gold-tint: #FDF4DA; --gold-ink: #5C4300;
  --ok: #1D6B3E; --ok-tint: #E3F2E8; --no: #B42318; --no-tint: #FBE7E4; --info: #8A5D00; --info-tint: #FBF0D5; --ask: #1C3664; --ask-tint: #E1E8F3;
  --head: "Oswald", "Arial Narrow", sans-serif; --body: "Roboto", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; background: var(--ground); color: var(--ink); font: 16px/1.55 var(--body) }
:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.num { font-variant-numeric: tabular-nums }

.shell { background: var(--navy); color: var(--on-navy); border-bottom: 4px solid var(--gold) }
.shell .in { max-width: 1240px; margin: 0 auto; padding-block: 14px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px }
.brand { font: 600 20px/1.2 var(--head); text-transform: uppercase; letter-spacing: .14em; margin: 0 }
.meta { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--on-navy-soft) }
.fake { background: var(--gold); color: #2A2000; font: 700 12px/1 var(--body); letter-spacing: .04em; text-transform: uppercase; border-radius: 3px; padding: 5px 8px }

main { max-width: 1240px; margin: 0 auto; padding-block: 24px 48px; display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); gap: 20px; align-items: start }
@media (max-width: 900px) { main { grid-template-columns: 1fr } }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0 }

/* Queue: the invoices waiting for coding, like the list the sites use today */
.queue-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px }
.queue-head h2 { margin: 0 }
.qcount { font-size: 13px; color: var(--soft) }
.qlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px }
.qrow { border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; background: var(--paper); cursor: grab; display: flex; flex-direction: column; gap: 4px; transition: border-color .15s ease-out, box-shadow .15s ease-out; user-select: none }
.qrow:hover { border-color: var(--blue); box-shadow: 0 2px 8px rgba(0,51,102,.08) }
.qrow:active { cursor: grabbing }
.qrow.dragging { opacity: .5 }
.qrow.current { border-color: var(--blue); box-shadow: inset 4px 0 0 var(--blue) }
.qrow.locked { cursor: default; opacity: .6 }
.qtop { display: flex; justify-content: space-between; gap: 10px; font-weight: 700 }
.qdesc { font-size: 14px; color: var(--soft) }
.qmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 13px; color: var(--soft); margin-top: 4px }
.chip { font-size: 12px; font-weight: 500; border-radius: 999px; padding: 2px 9px; background: var(--info-tint); color: var(--info) }
.chip.c-allowed { background: var(--ok-tint); color: var(--ok) } .chip.c-not_allowed { background: var(--no-tint); color: var(--no) }
.chip.c-needs_info { background: var(--info-tint); color: var(--info) } .chip.c-escalate { background: var(--ask-tint); color: var(--ask) }
.chip.c-run { background: var(--blue-tint); color: #00577D }
.qhint { font-size: 13px; color: var(--soft); margin: 12px 0 0 }

/* Drop zone: the check panel before an invoice is loaded */
.drop { border: 2px dashed var(--rule); border-radius: 8px; background: var(--paper); min-height: 320px; display: grid; place-items: center; text-align: center; padding: 32px; color: var(--soft); transition: border-color .15s ease-out, background-color .15s ease-out }
.drop b { display: block; font-size: 20px; color: var(--navy-deep); margin-bottom: 6px }
.drop svg { width: 40px; height: 40px; color: var(--blue); margin-bottom: 10px }
.tool.over .drop, .tool.over > .card:first-child { border-color: var(--blue); background: var(--blue-tint) }
.tool.over > .card:first-child { border-style: dashed }
.card { background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 22px }
h2 { font: 500 17px/1.2 var(--head); text-transform: uppercase; letter-spacing: .1em; color: var(--navy-deep); margin: 0 0 14px }

/* Invoice */
.inv-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 20px }
.vendor { font-size: 22px; font-weight: 700; margin: 0 }
.amount { font-size: 30px; font-weight: 700 }
.desc { margin: 2px 0 16px }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px 20px; margin: 0 0 18px }
.facts dt { font-size: 13px; color: var(--soft) } .facts dd { margin: 0; font-weight: 500 }
.coding { width: 100%; border-collapse: collapse }
.coding th, .coding td { text-align: left; padding: 10px 8px; border-top: 1px solid var(--rule); vertical-align: top }
.coding thead th { border-top: 0; font-size: 13px; font-weight: 500; color: var(--soft); padding-top: 0 }
.coding tbody th { font-weight: 500; width: 34% }
.blank { color: var(--info); font-weight: 700 }
.was { color: var(--soft); text-decoration: line-through }
.use { font-weight: 700 }
.use.changed { background: var(--gold-tint); color: var(--gold-ink); border-radius: 3px; padding: 1px 6px }

.go { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-top: 20px }
.btn { font: 500 17px var(--body); border-radius: 6px; padding: 12px 22px; cursor: pointer; border: 1px solid transparent; background: var(--blue); color: #fff }
.btn:hover { background: color-mix(in srgb, var(--blue) 86%, #000) }
.btn.quiet { background: var(--paper); color: var(--ink); border-color: var(--rule); font-size: 14px; padding: 7px 12px }
.btn:disabled { opacity: .45; cursor: not-allowed }
.hint { font-size: 14px; color: var(--soft) }

/* Trace */
.trace { list-style: none; margin: 0; padding: 0 }
.trace li { display: grid; grid-template-columns: 32px 1fr; gap: 0 12px; position: relative; padding-bottom: 14px }
.trace li:not(:last-child)::after { content: ""; position: absolute; left: 15px; top: 32px; bottom: 0; width: 2px; background: var(--rule) }
.ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); color: var(--navy-deep); border: 1px solid var(--rule) }
.ic svg { width: 17px; height: 17px }
.st-done .ic { background: var(--blue-tint); color: var(--blue); border-color: transparent }
.st-error .ic { background: var(--no-tint); color: var(--no); border-color: transparent }
.st-running .ic { border-color: var(--blue) }
.st-final .ic { background: var(--gold-tint); color: var(--gold-ink); border-color: var(--gold) }
.t { font-weight: 500; padding-top: 5px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px }
.st-running .t::after { content: ""; width: 12px; height: 12px; border: 2px solid var(--rule); border-top-color: var(--blue); border-radius: 50%; animation: spin .9s linear infinite }
.src { font-size: 12px; font-weight: 500; border-radius: 999px; padding: 2px 9px; background: var(--panel); color: var(--soft); white-space: nowrap }
.src.official { background: var(--blue-tint); color: #00577D }
.src.fakedoc { background: var(--gold-tint); color: var(--gold-ink) }
.d { font-size: 14px; color: var(--soft); margin-top: 2px }
.why { font-size: 14px; color: var(--ink); margin-top: 3px; font-style: italic }
.why b { font-style: normal; font-weight: 600; color: var(--blue) }
.enter { animation: stepin .35s cubic-bezier(.16,1,.3,1) both }
@keyframes spin { to { transform: rotate(360deg) } }
@keyframes stepin { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
@media (prefers-reduced-motion: reduce) { .st-running .t::after, .enter { animation: none } }
/* Trace categories: one color per kind of source */
.trace li { --c: var(--c-check); --ct: var(--c-check-t) }
.trace li.cat-rule { --c: var(--c-rule); --ct: var(--c-rule-t) }
.trace li.cat-vet { --c: var(--c-vet); --ct: var(--c-vet-t) }
.trace li.cat-claude { --c: var(--c-claude); --ct: var(--c-claude-t) }
.trace li.cat-pivot { --c: var(--c-pivot); --ct: var(--c-pivot-t) }
.trace li.st-done .ic, .trace li.st-final .ic { background: var(--ct); color: var(--c); border-color: transparent }
.trace li.st-running .ic { border-color: var(--c); color: var(--c) }
.sb { border-left: 3px solid var(--c); padding: 0 0 2px 12px; min-width: 0 }
.cat { display: block; font: 600 11px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--c); padding-top: 4px }
.t { padding-top: 3px }
.trace li.cat-pivot .sb { background: var(--ct); border: 2px solid var(--c); border-radius: 8px; padding: 8px 14px 10px }
.trace li.cat-pivot .t { font-weight: 700; font-size: 17px; color: var(--c) }
.trace li.cat-pivot .d { color: var(--ink) }
.trace li.cat-pivot.dead { --c: var(--no); --ct: var(--no-tint) }
.trace li.find-bad .t { color: var(--no); font-weight: 700 }
.trace li.find-ok .t { color: var(--ok) }
.trace-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap }
.trace-head h2 { margin-bottom: 8px }
.tlegend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--soft); margin: -4px 0 14px }
.tlegend span { display: inline-flex; align-items: center; gap: 6px }
.tlegend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block }
.src.official, .src.fakedoc { background: var(--panel); color: var(--soft) }
/* Month strip for veteran_history */
.hist { margin: 10px 0 2px; max-width: 600px }
.hist-cap { font-weight: 700; font-size: 15px; margin-bottom: 6px }
.hist-cap.over { color: var(--no) } .hist-cap.ok { color: var(--ok) }
.cells { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px }
.cell { height: 34px; border-radius: 4px; background: var(--panel); border: 1px solid var(--rule) }
.cell.paid { background: var(--blue); border-color: var(--blue) }
.cell.now { border: 2px dashed var(--ok); background: var(--ok-tint) }
.cell.now.over { border-color: var(--no); background: var(--no-tint) }
.mlab { font-size: 11px; color: var(--soft); text-align: center; margin-top: 3px; white-space: nowrap; overflow: hidden }
.mlab.now { color: var(--ink); font-weight: 700 }
.hlegend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--soft); margin-top: 8px }
.hlegend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; background: var(--panel); border: 1px solid var(--rule) }
.hlegend i.paid { background: var(--blue); border-color: var(--blue) }
.hlegend i.now { border: 2px dashed var(--no); background: var(--no-tint) }
.hlegend i.now.ok { border-color: var(--ok); background: var(--ok-tint) }
.hist.grow .cell { animation: cellin .3s ease-out both }
@keyframes cellin { from { opacity: 0; transform: scaleY(.4) } to { opacity: 1; transform: none } }
@media (prefers-reduced-motion: reduce) { .hist.grow .cell { animation: none } }
.tq { margin: 8px 0 2px; padding: 10px 14px; background: var(--panel); border-left: 3px solid var(--gold); border-radius: 0 6px 6px 0; font-size: 16px; line-height: 1.5 }
.tq span { display: block; margin-top: 6px; font-size: 13px }
.qlinks { display: flex !important; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px !important }
.qlink { font: 500 13px var(--body); color: var(--blue); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px }
#docview { border: 0; border-radius: 10px; padding: 0; width: min(760px, calc(100vw - 32px)); max-height: 85vh; box-shadow: 0 20px 60px rgba(0,0,0,.25) }
#docview::backdrop { background: rgba(20,30,45,.45) }
.dv { padding: 0 22px 22px; font-size: 15px; line-height: 1.55 }
.dvh { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; position: sticky; top: 0; z-index: 1; background: var(--paper); padding: 18px 0 10px; border-bottom: 1px solid var(--rule); margin-bottom: 6px }
.dv h4 { margin: 16px 0 6px; font-size: 15px }
.dv p { margin: 0 0 8px; padding: 4px 8px; border-radius: 4px }
.dv p.hit { box-shadow: inset 3px 0 0 var(--gold) }
.dv mark { background: var(--gold-tint); color: var(--ink); font-weight: 600; padding: 1px 2px; border-radius: 2px; box-shadow: 0 0 0 1px var(--gold) }

.elapsed { font-size: 14px; color: var(--soft); margin: 4px 0 0 44px }

/* Answer */
.verdict { display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; border-radius: 8px; margin-bottom: 20px }
.verdict svg { width: 28px; height: 28px; flex: none; margin-top: 2px }
.what { font-size: 23px; font-weight: 700; line-height: 1.25; margin: 0 0 4px }
.verdict p { margin: 0; color: var(--ink) }
.verdict p.what { color: inherit }
.v-allowed { background: var(--ok-tint); color: var(--ok) } .v-not_allowed { background: var(--no-tint); color: var(--no) }
.v-needs_info { background: var(--info-tint); color: var(--info) } .v-escalate { background: var(--ask-tint); color: var(--ask) }
h3 { font-size: 15px; margin: 0 0 8px }
.missed { margin: 0 0 6px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px }
.missed li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; font-size: 17px }
.missed svg { width: 18px; height: 18px; margin-top: 4px; color: var(--gold-ink) }
details { margin-top: 20px; border-top: 1px solid var(--rule); padding-top: 14px }
summary { cursor: pointer; font-weight: 500; color: var(--blue) }
blockquote { margin: 12px 0 0; padding: 12px 14px; background: var(--panel); border-radius: 6px }
.qsrc { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; font-size: 13px; color: var(--soft); margin-bottom: 4px }
.qsrc b { color: var(--ink); font-weight: 500 }
.found { color: var(--ok); font-weight: 500 } .notfound { color: var(--no); font-weight: 500 }
.why { margin: 10px 0 0; font-size: 15px }
.err { color: var(--no); font-weight: 500; margin: 0 }
footer { max-width: 1240px; margin: 0 auto; padding-block: 0 28px; font-size: 13px; color: var(--soft) }
@media (max-width: 560px) { .card { padding: 16px } .what { font-size: 20px } .coding th, .coding td { padding: 9px 5px } }
</style>

<header class="shell">
  <div class="in gutter">

<footer class="gutter">The invoices, veteran, funds, county agreement, foundation letter and finance policy are invented for this demo. Federal rule text is the official eCFR text. Not compliance advice.</footer>

<script type="application/json" id="regs-json">{"200.403":{"head":"\u00a7 200.403 Factors affecting allowability of costs.","paras":["Except where otherwise authorized by statute, costs must meet the following criteria to be allowable under Federal awards:","(a) Be necessary and reasonable for the performance of the Federal award and be allocable thereto under these principles.","(b) Conform to any limitations or exclusions set forth in these principles or in the Federal award as to types or amount of cost items.","(c) Be consistent with policies and procedures that apply uniformly to both federally financed and other activities of the recipient or subrecipient.","(d) Be accorded consistent treatment. For example, a cost must not be assigned to a Federal award as a direct cost if any other cost incurred for the same purpose in like circumstances has been allocated to the Federal award as an indirect cost.","(e) Be determined in accordance with generally accepted accounting principles (GAAP), except, for State and local governments and Indian Tribes only, as otherwise provided for in this part.","(f) Not be included as a cost or used to meet cost sharing requirements of any other federally-financed program in either the current or a prior period. See \u00a7 200.306(b).","(g) Be adequately documented. See \u00a7\u00a7 200.300 through 200.309.","(h) Administrative closeout costs may be incurred until the due date of the final report(s). If incurred, these costs must be liquidated prior to the due date of the final report(s) and charged to the final budget period of the award unless otherwise specified by the Federal agency. All other costs must be incurred during the approved budget period. At its discretion, the Federal agency is authorized to waive prior written approvals to carry forward unobligated balances to subsequent budget periods. See \u00a7 200.308(g)(3)."]},"200.404":{"head":"\u00a7 200.404 Reasonable costs.","paras":["A cost is reasonable if it does not exceed an amount that a prudent person would incur under the circumstances prevailing when the decision was made to incur the cost. In determining the reasonableness of a given cost, consideration must be given to the following:","(a) Whether the cost is generally recognized as ordinary and necessary for the recipient's or subrecipient's operation or the proper and efficient performance of the Federal award;","(b) The restraints or requirements imposed by such factors as sound business practices; arm's-length bargaining; Federal, State, local, tribal, and other laws and regulations; and terms and conditions of the Federal award;","(c) Market prices for comparable costs for the geographic area;","(d) Whether the individuals concerned acted with prudence in the circumstances considering their responsibilities to the recipient or subrecipient, its employees, its students or membership (if applicable), the public at large, and the Federal Government; and","(e) Whether the cost represents a deviation from the recipient's or subrecipient's established written policies and procedures for incurring costs."]},"200.405":{"head":"\u00a7 200.405 Allocable costs.","paras":["(a) Allocable costs in general. A cost is allocable to a Federal award or other cost objective if the cost is assignable to that Federal award or other cost objective in accordance with the relative benefits received. This standard is met if the cost satisfies any of the following criteria:","(1) Is incurred specifically for the Federal award;","(2) Benefits both the Federal award and other work of the recipient or subrecipient and can be distributed in proportions that may be approximated using reasonable methods; or","(3) Is necessary to the overall operation of the recipient or subrecipient and is assignable in part to the Federal award in accordance with these cost principles.","(b) Allocation of indirect costs. All activities which benefit from the recipient's or subrecipient's indirect cost, including unallowable activities and donated services by the recipient or subrecipient or third parties, will receive an appropriate allocation of indirect costs.","(c) Limitation on charging certain allocable costs to other Federal awards. A cost allocable to a particular Federal award may not be charged to other Federal awards (for example, to overcome fund deficiencies or to avoid restrictions imposed by Federal statutes, regulations, or the terms and conditions of the Federal awards). However, this prohibition would not preclude the recipient or subrecipient from shifting costs that are allowable under two or more Federal awards in accordance with existing Federal statutes, regulations, or the terms and conditions of the Federal awards.","(d) Direct cost allocation principles. If a cost benefits two or more projects or activities in proportions that can be determined without undue effort or cost, the cost must be allocated to the projects based on the proportional benefit. However, when those proportions cannot be determined because of the interrelationship of the work involved, then, notwithstanding paragraph (c), the costs may be allocated or transferred to benefitted projects on any reasonable documented basis. Where the purchase of equipment or other capital asset is specifically authorized under a Federal award, the costs are assignable to the Federal award regardless of the use that may be made of the equipment or other capital asset involved, when no longer needed for the purpose for which it was originally required. See also \u00a7\u00a7 200.310 through 200.316 and 200.439.","(e) Costs of contracts subject to CAS. If a contract is subject to CAS, costs must be allocated to that contract according to the Cost Accounting Standards, which take precedence over the allocation provisions in this part."]},"578.37":{"head":"\u00a7 578.37 Program components and uses of assistance.","paras":["(a) Continuum of Care funds may be used to pay for the eligible costs listed in \u00a7 578.39 through \u00a7 578.63 when used to establish and operate projects under five program components: permanent housing; transitional housing; supportive services only; HMIS; and, in some cases, homelessness prevention. Although grant funds may be used by recipients and subrecipients in all components for the eligible costs of contributing data to the HMIS designated by the Continuum of Care, only HMIS Leads may use grant funds for an HMIS component. Administrative costs are eligible for all components. All components are subject to the restrictions on combining funds for certain eligible activities in a single project found in \u00a7 578.87(c). The eligible program components are:","(1) Permanent housing (PH). Permanent housing is community-based housing, the purpose of which is to provide housing without a designated length of stay. Grant funds may be used for acquisition, rehabilitation, new construction, leasing, rental assistance, operating costs, and supportive services. PH includes:","(i) Permanent supportive housing for persons with disabilities (PSH). PSH can only provide assistance to individuals with disabilities and families in which one adult or child has a disability. Supportive services designed to meet the needs of the program participants must be made available to the program participants.","(ii) Rapid rehousing. Continuum of Care funds may provide supportive services, as set forth in \u00a7 578.53, and/or short-term (up to 3 months) and/or medium-term (for 3 to 24 months) tenant-based rental assistance, as set forth in \u00a7 578.51(c), as necessary to help a homeless individual or family, with or without disabilities, move as quickly as possible into permanent housing and achieve stability in that housing. When providing short-term and/or medium-term rental assistance to program participants, the rental assistance is subject to \u00a7 578.51(a)(1), but not \u00a7 578.51(a)(1)(i) and (ii); (a)(2); (c) and (f) through (i); and (l)(1). These projects:","(A) Must follow the written policies and procedures established by the Continuum of Care for determining and prioritizing which eligible families and individuals will receive rapid rehousing assistance, as well as the amount or percentage of rent that each program participant must pay.","(B) May set a maximum amount or percentage of rental assistance that a program participant may receive, a maximum number of months that a program participant may receive rental assistance, and/or a maximum number of times that a program participant may receive rental assistance. The recipient or subrecipient may also require program participants to share in the costs of rent. For the purposes of calculating rent for rapid rehousing, the rent shall equal the sum of the total monthly rent for the unit and, if the tenant pays separately for utilities, the monthly allowance for utilities (excluding telephone) established by the public housing authority for the area in which the housing is located.","(C) Limit rental assistance to no more than 24 months to a household.","(D) May provide supportive services for no longer than 6 months after rental assistance stops.","(E) Must re-evaluate, not less than once annually, that the program participant lacks sufficient resources and support networks necessary to retain housing without Continuum of Care assistance and the types and amounts of assistance that the program participant needs to retain housing. The recipient or subrecipient may require each program participant receiving assistance to notify the recipient or subrecipient of changes in the program participant's income or other circumstances (e.g., changes in household composition) that affect the program participant's need for assistance. When notified of a relevant change, the recipient or subrecipient must reevaluate the program participant's eligibility and the amount and types of assistance that the program participant needs.","(F) Require the program participant to meet with a case manager not less than once per month to assist the program participant in ensuring long-term housing stability. The project is exempt from this requirement if the Violence Against Women Act of 1994 (42 U.S.C. 13925 et seq.) or the Family Violence Prevention and Services Act (42 U.S.C. 10401 et seq.) prohibits the recipient carrying out the project from making its housing conditional on the participant's acceptance of services.","(2) Transitional Housing (TH). Transitional housing facilitates the movement of homeless individuals and families to PH within 24 months of entering TH. Grant funds may be used for acquisition, rehabilitation, new construction, leasing, rental assistance, operating costs, and supportive services.","(3) Supportive Service Only (SSO). Funds may be used for acquisition, rehabilitation, relocation costs, or leasing of a facility from which supportive services will be provided, and supportive services in order to provide supportive services to unsheltered and sheltered homeless persons for whom the recipient or subrecipient is not providing housing or housing assistance. SSO includes street outreach.","(4) HMIS. Funds may be used by HMIS Leads to lease a structure in which the HMIS is operated or as operating funds to operate a structure in which the HMIS is operated, and for other costs eligible in \u00a7 578.57.","(5) Homelessness prevention. Funds may be used by recipients in Continuums of Care-designated high-performing communities for housing relocation and stabilization services, and short- and/or medium-term rental assistance, as described in 24 CFR 576.105 and 24 CFR 576.106, that are necessary to prevent an individual or family from becoming homeless.","(b) Uses of assistance. Funds are available to pay for the eligible costs listed in \u00a7 578.39 through \u00a7 578.63 when used to:","(1) Establish new housing or new facilities to provide supportive services;","(2) Expand existing housing and facilities in order to increase the number of homeless persons served;","(3) Bring existing housing and facilities into compliance with State and local government health and safety standards, as described in \u00a7 578.87;","(4) Preserve existing permanent housing and facilities that provide supportive services;","(5) Provide supportive services for residents of supportive housing or for homeless persons not residing in supportive housing;","(6) Continue funding permanent housing when the recipient has received funding under this part for leasing, supportive services, operating costs, or rental assistance;","(7) Establish and operate an HMIS or comparable database; and","(8) Establish and carry out a Continuum of Care planning process and operate a Continuum of Care.","(c) Multiple purposes. Structures used to provide housing, supportive housing, supportive services, or as a facility for HMIS activities may also be used for other purposes. However, assistance under this part will be available only in proportion to the use of the structure for supportive housing or supportive services. If eligible and ineligible activities are carried out in separate portions of the same structure or in separate structures, grant funds may not be used to pay for more than the actual cost of acquisition, construction, or rehabilitation of the portion of the structure or structures used for eligible activities. If eligible and ineligible activities are carried out in the same structure, the costs will be prorated based on the amount of time that the space is used for eligible versus ineligible activities."]},"578.53":{"head":"\u00a7 578.53 Supportive services.","paras":["(a) In general. Grant funds may be used to pay the eligible costs of supportive services that address the special needs of the program participants. If the supportive services are provided in a supportive service facility not contained in a housing structure, the costs of day-to-day operation of the supportive service facility, including maintenance, repair, building security, furniture, utilities, and equipment are eligible as a supportive service.","(1) Supportive services must be necessary to assist program participants obtain and maintain housing.","(2) Recipients and subrecipients shall conduct an annual assessment of the service needs of the program participants and should adjust services accordingly.","(b) Duration. (1) For a transitional housing project, supportive services must be made available to residents throughout the duration of their residence in the project.","(2) Permanent supportive housing projects must provide supportive services for the residents to enable them to live as independently as is practicable throughout the duration of their residence in the project.","(3) Services may also be provided to former residents of transitional housing and current residents of permanent housing who were homeless in the prior 6 months, for no more than 6 months after leaving transitional housing or homelessness, respectively, to assist their adjustment to independent living.","(4) Rapid rehousing projects must require the program participant to meet with a case manager not less than once per month as set forth in \u00a7 578.37(a)(1)(ii)(F), to assist the program participant in maintaining long-term housing stability.","(c) Special populations. All eligible costs are eligible to the same extent for program participants who are unaccompanied homeless youth; persons living with HIV/AIDS; and victims of domestic violence, dating violence, sexual assault, or stalking.","(d) Ineligible costs. Any cost that is not described as an eligible cost under this section is not an eligible cost of providing supportive services using Continuum of Care program funds. Staff training and the costs of obtaining professional licenses or certifications needed to provide supportive services are not eligible costs.","(e) Eligible costs. (1) Annual Assessment of Service Needs. The costs of the assessment required by \u00a7 578.53(a)(2) are eligible costs.","(2) Assistance with moving costs. Reasonable one-time moving costs are eligible and include truck rental and hiring a moving company.","(3) Case management. The costs of assessing, arranging, coordinating, and monitoring the delivery of individualized services to meet the needs of the program participant(s) are eligible costs. Component services and activities consist of:","(i) Counseling;","(ii) Developing, securing, and coordinating services;","(iii) Using the centralized or coordinated assessment system as required under \u00a7 578.23(c)(9).","(iv) Obtaining federal, State, and local benefits;","(v) Monitoring and evaluating program participant progress;","(vi) Providing information and referrals to other providers;","(vii) Providing ongoing risk assessment and safety planning with victims of domestic violence, dating violence, sexual assault, and stalking; and","(viii) Developing an individualized housing and service plan, including planning a path to permanent housing stability.","(4) Child care. The costs of establishing and operating child care, and providing child-care vouchers, for children from families experiencing homelessness, including providing meals and snacks, and comprehensive and coordinated developmental activities, are eligible.","(i) The children must be under the age of 13, unless they are disabled children.","(ii) Disabled children must be under the age of 18.","(iii) The child-care center must be licensed by the jurisdiction in which it operates in order for its costs to be eligible.","(5) Education services. The costs of improving knowledge and basic educational skills are eligible.","(i) Services include instruction or training in consumer education, health education, substance abuse prevention, literacy, English as a Second Language, and General Educational Development (GED).","(ii) Component services or activities are screening, assessment and testing; individual or group instruction; tutoring; provision of books, supplies, and instructional material; counseling; and referral to community resources.","(6) Employment assistance and job training. The costs of establishing and operating employment assistance and job training programs are eligible, including classroom, online and/or computer instruction, on-the-job instruction, services that assist individuals in securing employment, acquiring learning skills, and/or increasing earning potential. The cost of providing reasonable stipends to program participants in employment assistance and job training programs is also an eligible cost.","(i) Learning skills include those skills that can be used to secure and retain a job, including the acquisition of vocational licenses and/or certificates.","(ii) Services that assist individuals in securing employment consist of:","(A) Employment screening, assessment, or testing;","(B) Structured job skills and job-seeking skills;","(C) Special training and tutoring, including literacy training and pre-vocational training;","(D) Books and instructional material;","(E) Counseling or job coaching; and","(F) Referral to community resources.","(7) Food. The cost of providing meals or groceries to program participants is eligible.","(8) Housing search and counseling services. Costs of assisting eligible program participants to locate, obtain, and retain suitable housing are eligible.","(i) Component services or activities are tenant counseling; assisting individuals and families to understand leases; securing utilities; and making moving arrangements.","(ii) Other eligible costs are:","(A) Mediation with property owners and landlords on behalf of eligible program participants;","(B) Credit counseling, accessing a free personal credit report, and resolving personal credit issues; and","(C) The payment of rental application fees.","(iii) Housing counseling, as defined in \u00a7 5.100, that is funded with or provided in connection with grant funds must be carried out in accordance with \u00a7 5.111. When recipients or subrecipients provide housing services to eligible persons that are incidental to a larger set of holistic case management services, these services do not meet the definition of Housing counseling, as defined in \u00a7 5.100, and therefore are not required to be carried out in accordance with the certification requirements of \u00a7 5.111.","(9) Legal services. Eligible costs are the fees charged by licensed attorneys and by person(s) under the supervision of licensed attorneys, for advice and representation in matters that interfere with the homeless individual or family's ability to obtain and retain housing.","(i) Eligible subject matters are child support; guardianship; paternity; emancipation; legal separation; orders of protection and other civil remedies for victims of domestic violence, dating violence, sexual assault, and stalking; appeal of veterans and public benefit claim denials; landlord tenant disputes; and the resolution of outstanding criminal warrants.","(ii) Component services or activities may include receiving and preparing cases for trial, provision of legal advice, representation at hearings, and counseling.","(iii) Fees based on the actual service performed (i.e., fee for service) are also eligible, but only if the cost would be less than the cost of hourly fees. Filing fees and other necessary court costs are also eligible. If the subrecipient is a legal services provider and performs the services itself, the eligible costs are the subrecipient's employees' salaries and other costs necessary to perform the services.","(iv) Legal services for immigration and citizenship matters and issues related to mortgages and homeownership are ineligible. Retainer fee arrangements and contingency fee arrangements are ineligible.","(10) Life skills training. The costs of teaching critical life management skills that may never have been learned or have been lost during the course of physical or mental illness, domestic violence, substance abuse, and homelessness are eligible. These services must be necessary to assist the program participant to function independently in the community. Component life skills training are the budgeting of resources and money management, household management, conflict management, shopping for food and other needed items, nutrition, the use of public transportation, and parent training.","(11) Mental health services. Eligible costs are the direct outpatient treatment of mental health conditions that are provided by licensed professionals. Component services are crisis interventions; counseling; individual, family, or group therapy sessions; the prescription of psychotropic medications or explanations about the use and management of medications; and combinations of therapeutic approaches to address multiple problems.","(12) Outpatient health services. Eligible costs are the direct outpatient treatment of medical conditions when provided by licensed medical professionals including:","(i) Providing an analysis or assessment of an individual's health problems and the development of a treatment plan;","(ii) Assisting individuals to understand their health needs;","(iii) Providing directly or assisting individuals to obtain and utilize appropriate medical treatment;","(iv) Preventive medical care and health maintenance services, including in-home health services and emergency medical services;","(v) Provision of appropriate medication;","(vi) Providing follow-up services; and","(vii) Preventive and noncosmetic dental care.","(13) Outreach services. The costs of activities to engage persons for the purpose of providing immediate support and intervention, as well as identifying potential program participants, are eligible.","(i) Eligible costs include the outreach worker's transportation costs and a cell phone to be used by the individual performing the outreach.","(ii) Component activities and services consist of: initial assessment; crisis counseling; addressing urgent physical needs, such as providing meals, blankets, clothes, or toiletries; actively connecting and providing people with information and referrals to homeless and mainstream programs; and publicizing the availability of the housing and/or services provided within the geographic area covered by the Continuum of Care.","(14) Substance abuse treatment services. The costs of program participant intake and assessment, outpatient treatment, group and individual counseling, and drug testing are eligible. Inpatient detoxification and other inpatient drug or alcohol treatment are ineligible.","(15) Transportation. Eligible costs are:","(i) The costs of program participant's travel on public transportation or in a vehicle provided by the recipient or subrecipient to and from medical care, employment, child care, or other services eligible under this section.","(ii) Mileage allowance for service workers to visit program participants and to carry out housing quality inspections;","(iii) The cost of purchasing or leasing a vehicle in which staff transports program participants and/or staff serving program participants;","(iv) The cost of gas, insurance, taxes, and maintenance for the vehicle;","(v) The costs of recipient or subrecipient staff to accompany or assist program participants to utilize public transportation; and","(vi) If public transportation options are not sufficient within the area, the recipient may make a one-time payment on behalf of a program participant needing car repairs or maintenance required to operate a personal vehicle, subject to the following:","(A) Payments for car repairs or maintenance on behalf of the program participant may not exceed 10 percent of the Blue Book value of the vehicle (Blue Book refers to the guidebook that compiles and quotes prices for new and used automobiles and other vehicles of all makes, models, and types);","(B) Payments for car repairs or maintenance must be paid by the recipient or subrecipient directly to the third party that repairs or maintains the car; and","(C) The recipients or subrecipients may require program participants to share in the cost of car repairs or maintenance as a condition of receiving assistance with car repairs or maintenance.","(16) Utility deposits. This form of assistance consists of paying for utility deposits. Utility deposits must be a one-time fee, paid to utility companies.","(17) Direct provision of services. If the service described in paragraphs (e)(1) through (e)(16) of this section is being directly delivered by the recipient or subrecipient, eligible costs for those services also include:","(i) The costs of labor or supplies, and materials incurred by the recipient or subrecipient in directly providing supportive services to program participants; and","(ii) The salary and benefit packages of the recipient and subrecipient staff who directly deliver the services."]},"578.59":{"head":"\u00a7 578.59 Project administrative costs.","paras":["(a) Eligible costs. The recipient or subrecipient may use up to 10 percent of any grant awarded under this part, excluding the amount for Continuum of Care Planning Activities and UFA costs, for the payment of project administrative costs related to the planning and execution of Continuum of Care activities. This does not include staff and overhead costs directly related to carrying out activities eligible under \u00a7 578.43 through \u00a7 578.57, because those costs are eligible as part of those activities. Eligible administrative costs include:","(1) General management, oversight, and coordination. Costs of overall program management, coordination, monitoring, and evaluation. These costs include, but are not limited to, necessary expenditures for the following:","(i) Salaries, wages, and related costs of the recipient's staff, the staff of subrecipients, or other staff engaged in program administration. In charging costs to this category, the recipient may include the entire salary, wages, and related costs allocable to the program of each person whose primary responsibilities with regard to the program involve program administration assignments, or the pro rata share of the salary, wages, and related costs of each person whose job includes any program administration assignments. The recipient may use only one of these methods for each fiscal year grant. Program administration assignments include the following:","(A) Preparing program budgets and schedules, and amendments to those budgets and schedules;","(B) Developing systems for assuring compliance with program requirements;","(C) Developing agreements with subrecipients and contractors to carry out program activities;","(D) Monitoring program activities for progress and compliance with program requirements;","(E) Preparing reports and other documents directly related to the program for submission to HUD;","(F) Coordinating the resolution of audit and monitoring findings;","(G) Evaluating program results against stated objectives; and","(H) Managing or supervising persons whose primary responsibilities with regard to the program include such assignments as those described in paragraph (a)(1)(i)(A) through (G) of this section.","(ii) Travel costs incurred for monitoring of subrecipients;","(iii) Administrative services performed under third-party contracts or agreements, including general legal services, accounting services, and audit services; and","(iv) Other costs for goods and services required for administration of the program, including rental or purchase of equipment, insurance, utilities, office supplies, and rental and maintenance (but not purchase) of office space.","(2) Training on Continuum of Care requirements. Costs of providing training on Continuum of Care requirements and attending HUD-sponsored Continuum of Care trainings.","(3) Environmental review. Costs of carrying out the environmental review responsibilities under \u00a7 578.31.","(b) Sharing requirement. (1) UFAs. If the recipient is a UFA that carries out a project, it may use up to 10 percent of the grant amount awarded for the project on project administrative costs. The UFA must share the remaining project administrative funds with its subrecipients.","(2) Recipients that are not UFAs. If the recipient is not a UFA, it must share at least 50 percent of project administrative funds with its subrecipients."]},"62.34":{"head":"\u00a7 62.34 Other supportive services.","paras":["Grantees may provide the following services which are necessary for maintaining independent living in permanent housing and housing stability:","(a) Rental assistance. Payment of rent, penalties or fees to help the participant remain in permanent housing or obtain permanent housing.","(1) A participant may receive rental assistance for a maximum of 10 months during a 2-year period (consecutive or nonconsecutive), such period beginning on the date that the grantee first pays rent on behalf of the participant; however, a participant cannot receive rental assistance for more than 6 months in any 12-month period beginning on the date that the grantee first pays rent on behalf of the participant. For extremely low-income veteran families, payments for rent cannot exceed 9 months in any 12-month period and 12 months during a 2-year period, such period beginning on the date that the grantee first pays rent on behalf of the participant. The rental assistance may be for rental payments that are currently due or are in arrears, and for the payment of penalties or fees incurred by a participant and required to be paid by the participant under an existing lease or court order. In all instances, rental assistance may only be provided if the payment of such rental assistance will directly allow the participant to remain in permanent housing or obtain permanent housing.","(2) Rental assistance must be paid by the grantee directly to the third party to whom rent is owed.","(3) As a condition of providing rental assistance, the grantee must help the participant develop a reasonable plan to address the participant's future ability to pay rent. Grantees must assist the participant to implement such plan by providing any necessary assistance or helping the participant to obtain any necessary public or private benefits or services.","(4) The rental assistance paid by a grantee must be in compliance with the following \u201crent reasonableness\u201d standard. \u201cRent reasonableness\u201d means the total rent charged for a unit must be reasonable in relation to the rents being charged during the same time period for comparable units in the private unassisted market and must not be in excess of rents being charged by the property owner during the same time period for comparable non-luxury unassisted units. To make this determination, the grantee should consider:","(i) The location, quality, size, type, and age of the unit; and","(ii) Any amenities, housing services, maintenance, and utilities to be provided by the property owner. Comparable rents can be checked by using a market study, by reviewing comparable units advertised for rent, or using a note from the property owner verifying the comparability of charged rents to other units owned by the property owner. Prior to providing rental assistance in the form of payment of penalties or fees incurred by a participant, the grantee must determine that such penalties or fees are reasonable.","(5) With respect to shared housing arrangements, the rent charged for a participant must be in relation to the size of the private space for that participant in comparison to other private space in the shared unit, excluding common space. A participant may be assigned a pro rata portion based on the ratio derived by dividing the number of bedrooms in their private space by the number of bedrooms in the unit. Participation in shared housing arrangements must be voluntary.","(6) Rental assistance payments cannot be provided on behalf of participants for the same period of time and for the same cost types that are being provided through another Federal housing subsidy program; however, such payments may be provided even though the participant is receiving State and local housing subsidy funds as long as the total subsidy received (including payments under this section) does not exceed the rent.","(7) Grantees may require participants to share in the cost of rent as a condition of receiving rental assistance.","(8) Extremely low-income veteran families and very low-income veteran families who meet the criteria of \u00a7 62.11 may be eligible to receive a rental subsidy as follows:","(i) For a 2-year period without recertification.","(ii) The applicable counties will be published annually in the Federal Register. A family must live in one of these applicable counties to be eligible for this subsidy. The counties will be chosen based on the cost and availability of affordable housing for both individuals and families within that county.","(iii) The maximum amount of this rental subsidy is 50 percent of reasonable rent as defined by paragraph (a)(4) of this section. Grantees must collaborate with their local Continuum of Care (CoC) as defined at 24 CFR 578.3 to determine the proper subsidy amounts to be used by all grantees in each applicable county.","(iv) Grantees must provide a letter of support from their local CoC to the Supportive Services for Veteran Families (SSVF) Program Office when requesting VA approval of this subsidy. The SSVF Program Office must approve all subsidy requests before the subsidy is used.","(v) Very low-income veteran families may receive this subsidy for a period of two years before recertification minus the number of months in which the recipient received the rental assistance provided under paragraph (a)(1) of this section.","(vi) Extremely low-income veteran families may receive this subsidy for up to a 2-year period before recertification following receipt of rental assistance under paragraph (a)(1) of this section.","(vii) For any month, the total rental payments provided to a family under this paragraph (a)(8) cannot be more than the total amount of rent. Payment of this subsidy by a grantee must conform to the requirements set forth in paragraphs (a)(2) through (7) of this section. The rental subsidy amount will not change for the veteran family in the second year of the two-year period, even if the annual amount published changes.","(viii) A veteran family will not need to be recertified as a very low-income veteran family as provided for by \u00a7 62.36(a) during the initial two-year period. After an initial two-year period, a family receiving this subsidy, or a combination of the rental assistance under paragraph (a)(1) of this section and this subsidy, may continue to receive rental payments under this section, but would require recertification at that time and once every two years.","(b) Utility-fee payment assistance. Payment of utility fees to help the participant to remain in permanent housing or obtain permanent housing.","(1) A participant may receive payments for utilities for a maximum of 10 months during a 2-year period, such period beginning on the date that the grantee first pays utility fees on behalf of the participant; provided, however, that a participant cannot receive payments for utilities for more than 6 months in any 12-month period beginning on the date that the grantee first pays a utility payment on behalf of the participant. For extremely low-income veteran families, payments for utilities cannot exceed 9 months in any 12-month period and 12 months during a 2-year period, such periods beginning on the date that the grantee first pays a utility payment on behalf of the participant. The payment for utilities may be for utility payments that are currently due or are in arrears, provided that the payment of such utilities will allow the participant to remain in permanent housing or obtain permanent housing.","(2) Payments for utilities must be paid by the grantee directly to a utility company. Payments for utilities only will be available if a participant, a legal representative of the participant, or a member of his/her household, has an account in his/her name with a utility company or proof of responsibility to make utility payments, such as cancelled checks or receipts in his/her name from a utility company.","(3) As a condition of providing payments for utilities, the grantee must help the participant develop a reasonable plan to address the participant's future ability to pay utility payments. Grantees must assist the participant to implement such plan by providing any necessary assistance or helping the participant to obtain any necessary public or private benefits or services.","(4) Payments for utilities cannot be provided on behalf of participants for the same period of time and for the same cost types that are being provided through another Federal, State, or local program.","(5) Grantees may require participants to share in the cost of utility payments as a condition of receiving payments for utilities.","(c) Deposits. Payment of security deposits or utility deposits to help the participant remain in permanent housing or obtain permanent housing.","(1) A participant may receive assistance with the payment of a security deposit a maximum of one time in every 2-year period, such period beginning on the date the grantee pays a security deposit on behalf of a participant.","(2) A participant may receive assistance with the payment of a utility deposit a maximum of one time in every 2-year period, such period beginning on the date the grantee pays a utility deposit on behalf of a participant.","(3) Any security deposit or utility deposit must be paid by the grantee directly to the third party to whom the security deposit or utility deposit is owed. The payment of such deposit must allow the participant to remain in the participant's existing permanent housing or help the participant to obtain and remain in permanent housing selected by the participant.","(4) As a condition of providing a security deposit payment or a utility deposit payment, the grantee must help the participant develop a reasonable plan to address the participant's future housing stability. Grantees must assist the participant to implement such plan by providing any necessary assistance or helping the participant to obtain any necessary public or private benefits or services.","(5) Security deposits and utility deposits covering the same period of time in which assistance is being provided through another housing subsidy program are eligible, as long as they cover separate cost types.","(6) Grantees may require participants to share in the cost of the security deposit or utility deposit as a condition of receiving assistance with such deposit.","(d) Moving costs. Payment of moving costs to help the participant to obtain permanent housing.","(1) A participant may receive assistance with moving costs a maximum of one time in every 3-year period, such period beginning on the date the grantee pays moving costs on behalf of a participant.","(2) Moving costs assistance must be paid by the grantee directly to a third party. Moving costs assistance includes reasonable moving costs, such as truck rental, hiring a moving company, or short-term storage fees for a maximum of 3 months or until the participant is in permanent housing, whichever is shorter.","(3) As a condition of providing moving costs assistance, the grantee must help the participant develop a reasonable plan to address the participant's future housing stability. Grantees must assist the participant to implement such plan by providing any necessary assistance or helping the participant to obtain any necessary public or private benefits or services.","(4) Moving costs assistance payments cannot be provided on behalf of participants for the same period of time and for the same cost types that are being provided through another Federal, State, or local program.","(5) Grantees may require participants to share in the cost of moving as a condition of receiving assistance with moving costs.","(e) General housing stability assistance. (1) A grantee may provide to a participant items necessary for a participant's life or safety on a temporary basis, in order to address a participant's emergency situation.","(2) A grantee may pay directly to a third party (and not to a participant), in an amount not to exceed $1,800, per participant during any 2-year period, beginning on the date that the grantee first submits a payment to a third party. This cap will be adjusted annually based on the Consumer Price Index for all Urban Consumers (CPI-U). This amount is for the following types of expenses:","(i) Expenses associated with gaining or keeping employment, such as obtaining uniforms, tools, certifications, and licenses.","(ii) Expenses associated with moving into permanent housing, such as obtaining basic kitchen utensils, bedding, and other supplies.","(iii) Expenses necessary for securing appropriate permanent housing, such as fees for housing applications, housing inspections, or background checks.","(3) A grantee may pay directly to a third party (and not to a participant) a reasonable amount for a broker's fee when such a third party has assisted in identifying permanent housing. The reasonableness of a fee will be determined based on conditions in the local housing market.","(f) Emergency housing assistance. If permanent housing, appropriate shelter beds and transitional housing are not available and subsequent rental housing has been identified generally but is not immediately available for move-in by the participant, then a grantee may place a participant in emergency housing, subject to the following limitations:","(1) Placement for a single veteran may not exceed 72 hours, unless the grantee can certify that appropriate shelter beds and transitional housing are still unavailable at the end of the 72 hour period.","(2) Placement for a veteran and his or her spouse with dependent(s) may not exceed 60 days.","(3) A participant may be placed in emergency housing only once during any 2-year period, beginning on the date that the grantee first pays for emergency housing on behalf of the participant.","(4) Permanent housing will be available before the end of the period during which the participant is placed in emergency housing.","(5) The cost of the emergency housing must be reasonable in relation to the costs charged for other available emergency housing considering the location, quality, size, and type of the emergency housing.","(g) Other. Other services as set forth in the Notice of Fund Availability or as approved by VA that are consistent with the Supportive Services for Veteran Families Program. Applicants may propose additional services in their supportive services grant application, and grantees may propose additional services by submitting a written request to modify the supportive services grant in accordance with \u00a7 62.60."]},"62.70":{"head":"\u00a7 62.70 Financial management and administrative costs.","paras":["(a) Grantees must comply with applicable requirements of the Uniform Administrative Requirements, Cost Principles, and Audit Requirements for Federal Awards under 2 CFR part 200.","(b) Grantees must use a financial management system that provides adequate fiscal control and accounting records and meets the requirements set forth in 2 CFR part 200.","(c) Payment up to the amount specified in the supportive services grant must be made only for allowable, allocable, and reasonable costs in conducting the work under the supportive services grant. The determination of allowable costs must be made in accordance with the applicable Federal Cost Principles set forth in 2 CFR part 200.","(d) Grantees are subject to the Uniform Administrative Requirements for Grants and Agreements with Institutions of Higher Education, Hospitals and other Non-Profit Organizations, codified at 38 CFR Part 49.","(e) Costs for administration by a grantee must not exceed 10 percent of the total amount of the supportive services grant. Administrative costs will consist of all direct and indirect costs associated with the management of the program. These costs will include the administrative costs, both direct and indirect, of subcontractors."]}}</script>

// ---------- Deterministic checks ----------
const mIdx = s => { const [y, m] = s.split("-").map(Number); return y * 12 + (m - 1); };
const money = n => "$" + Number(n).toLocaleString("en-US", { maximumFractionDigits: 0 });

function windowCount(history, period, per12, per24) {
  if (!history || !history.length) return { used12: 0, used24: 0, ok: true, anchor: null };
  const anchor = Math.min(...history.map(mIdx));
  const t = mIdx(period);
  const b12 = Math.floor((t - anchor) / 12), b24 = Math.floor((t - anchor) / 24);
  const in12 = history.filter(h => Math.floor((mIdx(h) - anchor) / 12) === b12 && h !== period).length;
  const in24 = history.filter(h => Math.floor((mIdx(h) - anchor) / 24) === b24 && h !== period).length;
  return { used12: in12, used24: in24, ok: in12 + 1 <= per12 && in24 + 1 <= per24, anchor: history.slice().sort()[0] };
}

function yearsBetween(a, b) { return (new Date(b) - new Date(a)) / (365.25 * 24 * 3600 * 1000); }

function computeChecks(inv) {
  const out = [];
  const add = (label, value, state) => out.push({ label, value, state });
  const site = SITES[inv.site];
  const has = f => site.funds.includes(f);
  const ssvf = site.funds.find(f => FUNDS[f].program === "SSVF");
  const c = inv.client ? CLIENTS[inv.client] : null;

  const req = [...STD, ...(["rent", "deposit"].includes(inv.kind) ? RENT_DOCS : [])];
  const missing = req.filter(d => !inv.backup.includes(d));
  add("Backup in packet", missing.length ? "Missing: " + missing.join(", ") : "All required backup attached", missing.length ? "bad" : "ok");

  if (inv.client) {
    add("Payee", inv.payeeType === "Participant" ? "Paid to the participant, not a third party" : inv.payeeType + " (third party)", inv.payeeType === "Participant" ? "bad" : "ok");
    if (c.unavailable) { add("Participant history", c.unavailable, "missing"); return out; }
    add("Participant income level", c.tier + " (" + c.ami + "% of Area Median Income)", "info");
  }

  const eli = c && c.tier === "Extremely low income";
  const lim = eli ? [9, 12] : [6, 10];

  if ((inv.kind === "rent" || inv.kind === "late_fee") && ssvf) {
    const w = windowCount(c.rent, inv.period, lim[0], lim[1]);
    if (inv.kind === "rent") add("SSVF rent months used", w.anchor ? `${w.used12} in current 12-month period, ${w.used24} in current 2-year period (from ${w.anchor}). This invoice would be month ${w.used12 + 1}. Limit: ${lim[0]} in 12, ${lim[1]} in 24.` : "No SSVF rent paid yet. This would be month 1.", w.ok ? "ok" : "bad");
    else add("SSVF rent months used", `${w.used12} in current 12-month period, ${w.used24} in current 2-year period. Fee relates to ${inv.period}.`, "info");
  }
  if (inv.kind === "rent" || inv.kind === "late_fee") {
    for (const o of c.other) {
      const active = mIdx(o.from) <= mIdx(inv.period);
      add("Other subsidy: " + o.program, `${o.level}, covers ${o.covers}, ${money(o.monthly)} a month from ${o.from}${active ? " (active for " + inv.period + ")" : ""}`, active && o.level === "Federal" ? "bad" : "info");
      if (active && o.level !== "Federal" && c.unitRent && inv.kind === "rent") add("Total subsidy vs rent", `${money(o.monthly)} + this ${money(inv.amount)} = ${money(o.monthly + inv.amount)}; unit rent ${money(c.unitRent)}`, o.monthly + inv.amount <= c.unitRent ? "ok" : "bad");
    }
    if (!c.other.length) add("Other subsidies", "None on file", "ok");
    if (has("CHF-H") && inv.kind === "rent") add("County rent cap (B2)", `${money(inv.amount)} vs ${money(2000)} limit; income ${c.ami}% AMI vs 50% limit`, inv.amount <= 2000 && c.ami <= 50 ? "ok" : "bad");
  }
  if (inv.kind === "deposit") {
    const last = (c.securityDeposits || []).slice().sort().pop();
    if (ssvf) add("SSVF security deposits", last ? `Last paid ${last}; ${yearsBetween(last, inv.date) < 2 ? "within" : "outside"} the 2-year period` : "None paid", last && yearsBetween(last, inv.date) < 2 ? "bad" : "ok");
    const rent = inv.unitRentOverride || c.unitRent;
    if (has("CHF-H")) add("County deposit cap (B4)", `${money(inv.amount)} deposit vs ${money(rent)} monthly rent`, inv.amount <= rent ? "ok" : "bad");
  }
  if (inv.kind === "utility" && ssvf) {
    const w = windowCount(c.utility || [], inv.period, lim[0], lim[1]);
    add("SSVF utility months used", `${w.used12} in current 12-month period. This would be month ${w.used12 + 1}. Limit: ${lim[0]} in 12.`, w.ok ? "ok" : "bad");
    if (c.utilityAccount) add("Utility account", c.utilityAccount, "info");
  }
  if (inv.kind === "moving" && ssvf) {
    const last = (c.moving || []).slice().sort().pop();
    add("SSVF moving costs", last ? `Last paid ${last}; ${yearsBetween(last, inv.date) < 3 ? "within" : "outside"} the 3-year period` : "None paid", last && yearsBetween(last, inv.date) < 3 ? "bad" : "ok");
  }
  if (inv.kind === "ghsa" && ssvf) {
    const used = (c.ghsa || []).reduce((s, g) => s + g.amount, 0);
    add("SSVF general housing stability assistance", `${money(used)} used + ${money(inv.amount)} = ${money(used + inv.amount)} vs ${money(1800)} base cap (CPI-adjusted yearly; current figure not loaded)`, used + inv.amount <= 1800 ? "ok" : "bad");
  }
  if (has("RIDGE") && ["ghsa", "moving", "gift", "legal"].includes(inv.kind) && c) {
    const used = (c.ridgeFlex || []).reduce((s, g) => s + g.amount, 0);
    add("Ridgeline flexible assistance (R1)", `${money(used)} used in last 12 months + ${money(inv.amount)} = ${money(used + inv.amount)} vs ${money(500)} limit`, used + inv.amount <= 500 ? "ok" : "bad");
  }
  if (inv.kind === "training" && has("RIDGE")) {
    const used = site.ridgeStaffDevUsed;
    add("Ridgeline staff development (R2)", `${money(used)} used this year at ${inv.site} + ${money(inv.amount)} = ${money(used + inv.amount)} vs ${money(3000)} limit`, used + inv.amount <= 3000 ? "ok" : "bad");
  }
  if (inv.kind === "admin") {
    for (const f of site.funds.filter(f => FUNDS[f].total)) {
      const F = FUNDS[f], after = F.adminSpent + inv.amount, pct = after / F.total * 100;
      add("Admin cap: " + f, `${money(F.adminSpent)} spent + ${money(inv.amount)} = ${money(after)} (${pct.toFixed(1)}% of ${money(F.total)}; limit 10%)`, pct <= 10 ? "ok" : "bad");
    }
  }
  return out;
}

const norm = s => String(s || "").toLowerCase().replace(/[‘’“”"']/g, "").replace(/[^a-z0-9$%]+/g, " ").trim();
function verifyQuote(q, DOCS) {
  if (!q || !q.quote) return false;
  const doc = DOCS[q.doc];
  const hay = norm(doc ? docText(doc) : Object.values(DOCS).map(docText).join(" "));
  const parts = String(q.quote).split(/\.\.\.|…/).map(norm).filter(p => p.length > 3);
  return parts.length > 0 && parts.every(p => hay.includes(p));
}

const ECFR_TITLE = { "2CFR200": 2, "38CFR62": 38, "24CFR578": 24 };
function locateQuote(q, DOCS) {
  const doc = q && DOCS[q.doc];
  if (!doc || !q.quote) return null;
  const parts = String(q.quote).split(/\.\.\.|…/).map(norm).filter(p => p.length > 3);
  for (let si = 0; si < doc.sections.length; si++) {
    const sec = doc.sections[si];
    const pi = sec.paras.findIndex(p => parts.some(x => norm(p).includes(x)));
    if (pi >= 0 || parts.every(x => norm(sec.head + " " + sec.paras.join(" ")).includes(x))) {
      const m = sec.key ? String(q.section || "").replace(/\s/g, "").match(new RegExp(sec.key.replace(".", "\\.") + "((\\([a-z0-9]+\\))+)", "i")) : null;
      const url = sec.key && ECFR_TITLE[q.doc] ? `https://www.ecfr.gov/current/title-${ECFR_TITLE[q.doc]}/section-${sec.key}${m ? "#p-" + sec.key + m[1] : ""}` : null;
      return { doc: q.doc, section: si, para: pi, url };
    }
  }
  return null;
}

function scoreResult(inv, r) {
  const e = inv.expected;
  const status = e.status.includes(r.status);
  const fund = e.fund.includes(r.suggested ? (r.suggested.fund || null) : null);
  const sec = norm((r.deciding && r.deciding.section) || "").replace(/\s/g, "");
  const cite = e.cite.some(c => sec.includes(norm(c).replace(/\s/g, "")));
  return { status, fund, cite };
}

function generatePractice(seed, n) {
  const R = makeRng(seed);
  const pool = PRACTICE_TEMPLATES.flatMap(t => Array(t.w).fill(t));
  const out = [];
  for (let i = 0; i < n; i++) {
    const t = R.pick(pool);
    const site = R.pick(t.sites || Object.keys(SITES));
    const g = t.make(R, site);
    const id = `P-${String(i + 1).padStart(2, "0")}`;
    const cid = g.client ? `R-${String(R.int(100, 999))}` + String.fromCharCode(65 + i % 26) : null;
    if (cid) CLIENTS[cid] = g.client;
    // analyst entries: start from correct coding, then blank some fields and plant the template's typical mistake
    const a = {};
    for (const k of ["fund", "category", "cost_type", "service_period"]) a[k] = g.coding[k] || "";
    if (g.wrongFund && R.next() < 0.8) a.fund = g.wrongFund;
    if (g.wrongType) { a.cost_type = "Program"; a.category = "SS-Case-Management"; }
    if (!g.keepWrong) for (const k of ["fund", "category", "cost_type", "service_period"]) if (R.next() < 0.3) a[k] = "";
    if (!g.coding.fund && R.next() < 0.6) a.fund = ssvfOf(site);
    const day = R.int(1, 4);
    out.push({ id, site, vendor: g.vendor, payee: g.payeeType === "Participant" ? `Participant ${cid}` : g.vendor, payeeType: g.payeeType, amount: g.amount, date: `2026-11-0${day}`, period: g.period || "2026-11", kind: g.kind, client: cid, description: g.description, backup: g.backup, unitRentOverride: g.unitRentOverride, analyst: a, expected: g.expected, caseKey: t.key, caseLabel: t.label, practice: true });
  }
  return out;
}

// Code checks: graded by code, never by Claude. critical = a miss sinks the whole case.
const CODE_CHECKS = [
  { id: "C1", label: "Right answer", critical: true },
  { id: "C2", label: "Right fund", critical: true },
  { id: "C3", label: "Right deciding rule", critical: false },
  { id: "C4", label: "Quote found in the rule text", critical: true },
  { id: "C5", label: "Plain-language summary", critical: false },
  { id: "C6", label: "Every fund at the site rated", critical: false },
  { id: "C7", label: "Who pays matches the coding", critical: false }
];
function codeChecks(inv, r, DOCS) {
  const sc = scoreResult(inv, r);
  const plain = !/(CFR|§|\b[PBR]\d\b|\b[A-Z]{3,5}-[A-Z]{1,4}\b|\d{3}\.\d)/.test(`${r.summary || ""} ${r.explain || ""}`);
  const siteFunds = SITES[inv.site].funds;
  const rated = Array.isArray(r.funds) && siteFunds.every(f => r.funds.some(x => x.fund === f));
  const payer = Array.isArray(r.funds) ? (r.funds.find(x => x.verdict === "pays") || {}).fund || null : undefined;
  const sugFund = r.suggested ? (r.suggested.fund || null) : null;
  return {
    C1: sc.status, C2: sc.fund, C3: sc.cite, C4: verifyQuote(r.deciding, DOCS), C5: plain, C6: rated,
    C7: payer === undefined ? false : payer === sugFund
  };
}

function buildJudgePrompt(inv, r) {
  const out = { status: r.status, suggested: r.suggested, summary: r.summary, explain: r.explain, question: r.question, deciding_rule: r.deciding };

INVOICE:
${JSON.stringify(packet, null, 1)}

}
