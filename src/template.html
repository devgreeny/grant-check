<meta charset="utf-8">
<title>Grant Coding Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Roboto:wght@400;500;700&display=swap">
<style>
/* Demo: one invoice, one button, the trace, the answer. Full version (evals, reviewer tools) is in archive/. */
:root {
  --ground: #EEF1F5; --paper: #FFFFFF; --panel: #F5F7FA; --ink: #1B2430; --soft: #5A6573; --rule: #D6DCE4;
  --navy: #003366; --navy-deep: #1C3664; --on-navy: #FFFFFF; --on-navy-soft: #B9C8DC;
  --blue: #0074A6; --blue-tint: #E3F1F8;
  --c-rule: #0074A6; --c-rule-t: #E3F1F8; --c-vet: #6B3FA0; --c-vet-t: #EFE8F7; --c-check: #4A5868; --c-check-t: #E9EDF2; --c-claude: #1C3664; --c-claude-t: #E1E8F3; --c-pivot: #8A5D00; --c-pivot-t: #FBF0D5;
  --gold: #E9B732; --gold-tint: #FDF4DA; --gold-ink: #5C4300;
  --ok: #1D6B3E; --ok-tint: #E3F2E8; --no: #B42318; --no-tint: #FBE7E4; --info: #8A5D00; --info-tint: #FBF0D5; --ask: #1C3664; --ask-tint: #E1E8F3;
  --head: "Oswald", "Arial Narrow", sans-serif; --body: "Roboto", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; background: var(--ground); color: var(--ink); font: 16px/1.55 var(--body) }
:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.num { font-variant-numeric: tabular-nums }

.shell { background: var(--navy); color: var(--on-navy); border-bottom: 4px solid var(--gold) }
.shell .in { max-width: 1240px; margin: 0 auto; padding-block: 14px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px }
.brand { font: 600 20px/1.2 var(--head); text-transform: uppercase; letter-spacing: .14em; margin: 0 }
.meta { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--on-navy-soft) }
.fake { background: var(--gold); color: #2A2000; font: 700 12px/1 var(--body); letter-spacing: .04em; text-transform: uppercase; border-radius: 3px; padding: 5px 8px }

main { max-width: 1240px; margin: 0 auto; padding-block: 24px 48px; display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); gap: 20px; align-items: start }
@media (max-width: 900px) { main { grid-template-columns: 1fr } }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0 }

/* Queue: the invoices waiting for coding, like the list the sites use today */
.queue-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px }
.queue-head h2 { margin: 0 }
.qcount { font-size: 13px; color: var(--soft) }
.qlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px }
.qrow { border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; background: var(--paper); cursor: grab; display: flex; flex-direction: column; gap: 4px; transition: border-color .15s ease-out, box-shadow .15s ease-out; user-select: none }
.qrow:hover { border-color: var(--blue); box-shadow: 0 2px 8px rgba(0,51,102,.08) }
.qrow:active { cursor: grabbing }
.qrow.dragging { opacity: .5 }
.qrow.current { border-color: var(--blue); box-shadow: inset 4px 0 0 var(--blue) }
.qrow.locked { cursor: default; opacity: .6 }
.qtop { display: flex; justify-content: space-between; gap: 10px; font-weight: 700 }
.qdesc { font-size: 14px; color: var(--soft) }
.qmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 13px; color: var(--soft); margin-top: 4px }
.chip { font-size: 12px; font-weight: 500; border-radius: 999px; padding: 2px 9px; background: var(--info-tint); color: var(--info) }
.chip.c-allowed { background: var(--ok-tint); color: var(--ok) } .chip.c-not_allowed { background: var(--no-tint); color: var(--no) }
.chip.c-needs_info { background: var(--info-tint); color: var(--info) } .chip.c-escalate { background: var(--ask-tint); color: var(--ask) }
.chip.c-run { background: var(--blue-tint); color: #00577D }
.qhint { font-size: 13px; color: var(--soft); margin: 12px 0 0 }

/* Drop zone: the check panel before an invoice is loaded */
.drop { border: 2px dashed var(--rule); border-radius: 8px; background: var(--paper); min-height: 320px; display: grid; place-items: center; text-align: center; padding: 32px; color: var(--soft); transition: border-color .15s ease-out, background-color .15s ease-out }
.drop b { display: block; font-size: 20px; color: var(--navy-deep); margin-bottom: 6px }
.drop svg { width: 40px; height: 40px; color: var(--blue); margin-bottom: 10px }
.tool.over .drop, .tool.over > .card:first-child { border-color: var(--blue); background: var(--blue-tint) }
.tool.over > .card:first-child { border-style: dashed }
.card { background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 22px }
h2 { font: 500 17px/1.2 var(--head); text-transform: uppercase; letter-spacing: .1em; color: var(--navy-deep); margin: 0 0 14px }

/* Invoice */
.inv-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 20px }
.vendor { font-size: 22px; font-weight: 700; margin: 0 }
.amount { font-size: 30px; font-weight: 700 }
.desc { margin: 2px 0 16px }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px 20px; margin: 0 0 18px }
.facts dt { font-size: 13px; color: var(--soft) } .facts dd { margin: 0; font-weight: 500 }
.coding { width: 100%; border-collapse: collapse }
.coding th, .coding td { text-align: left; padding: 10px 8px; border-top: 1px solid var(--rule); vertical-align: top }
.coding thead th { border-top: 0; font-size: 13px; font-weight: 500; color: var(--soft); padding-top: 0 }
.coding tbody th { font-weight: 500; width: 34% }
.blank { color: var(--info); font-weight: 700 }
.was { color: var(--soft); text-decoration: line-through }
.use { font-weight: 700 }
.use.changed { background: var(--gold-tint); color: var(--gold-ink); border-radius: 3px; padding: 1px 6px }

.go { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-top: 20px }
.btn { font: 500 17px var(--body); border-radius: 6px; padding: 12px 22px; cursor: pointer; border: 1px solid transparent; background: var(--blue); color: #fff }
.btn:hover { background: color-mix(in srgb, var(--blue) 86%, #000) }
.btn.quiet { background: var(--paper); color: var(--ink); border-color: var(--rule); font-size: 14px; padding: 7px 12px }
.btn:disabled { opacity: .45; cursor: not-allowed }
.hint { font-size: 14px; color: var(--soft) }

/* Trace */
.trace { list-style: none; margin: 0; padding: 0 }
.trace li { display: grid; grid-template-columns: 32px 1fr; gap: 0 12px; position: relative; padding-bottom: 14px }
.trace li:not(:last-child)::after { content: ""; position: absolute; left: 15px; top: 32px; bottom: 0; width: 2px; background: var(--rule) }
.ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); color: var(--navy-deep); border: 1px solid var(--rule) }
.ic svg { width: 17px; height: 17px }
.st-done .ic { background: var(--blue-tint); color: var(--blue); border-color: transparent }
.st-error .ic { background: var(--no-tint); color: var(--no); border-color: transparent }
.st-running .ic { border-color: var(--blue) }
.st-final .ic { background: var(--gold-tint); color: var(--gold-ink); border-color: var(--gold) }
.t { font-weight: 500; padding-top: 5px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px }
.st-running .t::after { content: ""; width: 12px; height: 12px; border: 2px solid var(--rule); border-top-color: var(--blue); border-radius: 50%; animation: spin .9s linear infinite }
.src { font-size: 12px; font-weight: 500; border-radius: 999px; padding: 2px 9px; background: var(--panel); color: var(--soft); white-space: nowrap }
.src.official { background: var(--blue-tint); color: #00577D }
.src.fakedoc { background: var(--gold-tint); color: var(--gold-ink) }
.d { font-size: 14px; color: var(--soft); margin-top: 2px }
.why { font-size: 14px; color: var(--ink); margin-top: 3px; font-style: italic }
.why b { font-style: normal; font-weight: 600; color: var(--blue) }
.enter { animation: stepin .35s cubic-bezier(.16,1,.3,1) both }
@keyframes spin { to { transform: rotate(360deg) } }
@keyframes stepin { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
@media (prefers-reduced-motion: reduce) { .st-running .t::after, .enter { animation: none } }
/* Trace categories: one color per kind of source */
.trace li { --c: var(--c-check); --ct: var(--c-check-t) }
.trace li.cat-rule { --c: var(--c-rule); --ct: var(--c-rule-t) }
.trace li.cat-vet { --c: var(--c-vet); --ct: var(--c-vet-t) }
.trace li.cat-claude { --c: var(--c-claude); --ct: var(--c-claude-t) }
.trace li.cat-pivot { --c: var(--c-pivot); --ct: var(--c-pivot-t) }
.trace li.st-done .ic, .trace li.st-final .ic { background: var(--ct); color: var(--c); border-color: transparent }
.trace li.st-running .ic { border-color: var(--c); color: var(--c) }
.sb { border-left: 3px solid var(--c); padding: 0 0 2px 12px; min-width: 0 }
.cat { display: block; font: 600 11px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--c); padding-top: 4px }
.t { padding-top: 3px }
.trace li.cat-pivot .sb { background: var(--ct); border: 2px solid var(--c); border-radius: 8px; padding: 8px 14px 10px }
.trace li.cat-pivot .t { font-weight: 700; font-size: 17px; color: var(--c) }
.trace li.cat-pivot .d { color: var(--ink) }
.trace li.cat-pivot.dead { --c: var(--no); --ct: var(--no-tint) }
.trace li.find-bad .t { color: var(--no); font-weight: 700 }
.trace li.find-ok .t { color: var(--ok) }
.tlegend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--soft); margin: -4px 0 14px }
.tlegend span { display: inline-flex; align-items: center; gap: 6px }
.tlegend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block }
.src.official, .src.fakedoc { background: var(--panel); color: var(--soft) }
/* Month strip for veteran_history */
.hist { margin: 10px 0 2px; max-width: 600px }
.hist-cap { font-weight: 700; font-size: 15px; margin-bottom: 6px }
.hist-cap.over { color: var(--no) } .hist-cap.ok { color: var(--ok) }
.cells { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px }
.cell { height: 34px; border-radius: 4px; background: var(--panel); border: 1px solid var(--rule) }
.cell.paid { background: var(--blue); border-color: var(--blue) }
.cell.now { border: 2px dashed var(--ok); background: var(--ok-tint) }
.cell.now.over { border-color: var(--no); background: var(--no-tint) }
.mlab { font-size: 11px; color: var(--soft); text-align: center; margin-top: 3px; white-space: nowrap; overflow: hidden }
.mlab.now { color: var(--ink); font-weight: 700 }
.hlegend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--soft); margin-top: 8px }
.hlegend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; background: var(--panel); border: 1px solid var(--rule) }
.hlegend i.paid { background: var(--blue); border-color: var(--blue) }
.hlegend i.now { border: 2px dashed var(--no); background: var(--no-tint) }
.hlegend i.now.ok { border-color: var(--ok); background: var(--ok-tint) }
.hist.grow .cell { animation: cellin .3s ease-out both }
@keyframes cellin { from { opacity: 0; transform: scaleY(.4) } to { opacity: 1; transform: none } }
@media (prefers-reduced-motion: reduce) { .hist.grow .cell { animation: none } }
.tq { margin: 8px 0 2px; padding: 10px 14px; background: var(--panel); border-left: 3px solid var(--gold); border-radius: 0 6px 6px 0; font-size: 16px; line-height: 1.5 }
.tq span { display: block; margin-top: 6px; font-size: 13px }
.elapsed { font-size: 14px; color: var(--soft); margin: 4px 0 0 44px }

/* Answer */
.verdict { display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; border-radius: 8px; margin-bottom: 20px }
.verdict svg { width: 28px; height: 28px; flex: none; margin-top: 2px }
.what { font-size: 23px; font-weight: 700; line-height: 1.25; margin: 0 0 4px }
.verdict p { margin: 0; color: var(--ink) }
.verdict p.what { color: inherit }
.v-allowed { background: var(--ok-tint); color: var(--ok) } .v-not_allowed { background: var(--no-tint); color: var(--no) }
.v-needs_info { background: var(--info-tint); color: var(--info) } .v-escalate { background: var(--ask-tint); color: var(--ask) }
h3 { font-size: 15px; margin: 0 0 8px }
.missed { margin: 0 0 6px; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px }
.missed li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; font-size: 17px }
.missed svg { width: 18px; height: 18px; margin-top: 4px; color: var(--gold-ink) }
details { margin-top: 20px; border-top: 1px solid var(--rule); padding-top: 14px }
summary { cursor: pointer; font-weight: 500; color: var(--blue) }
blockquote { margin: 12px 0 0; padding: 12px 14px; background: var(--panel); border-radius: 6px }
.qsrc { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; font-size: 13px; color: var(--soft); margin-bottom: 4px }
.qsrc b { color: var(--ink); font-weight: 500 }
.found { color: var(--ok); font-weight: 500 } .notfound { color: var(--no); font-weight: 500 }
.why { margin: 10px 0 0; font-size: 15px }
.err { color: var(--no); font-weight: 500; margin: 0 }
footer { max-width: 1240px; margin: 0 auto; padding-block: 0 28px; font-size: 13px; color: var(--soft) }
@media (max-width: 560px) { .card { padding: 16px } .what { font-size: 20px } .coding th, .coding td { padding: 9px 5px } }
</style>

<header class="shell">
  <div class="in gutter">
    <h1 class="brand">Grant Coding Check</h1>
    <div class="meta"><span class="fake">Fake data</span><span>Basecamp prototype</span></div>
  </div>
</header>
<main class="gutter" id="app"></main>
<footer class="gutter">The invoices, veteran, funds, county agreement, foundation letter and finance policy are invented for this demo. Federal rule text is the official eCFR text. Not compliance advice.</footer>

<script>

</script>
<script>
(function () {
  const DOCS = allDocs(JSON.parse(document.getElementById("regs-json").textContent));
  // The demo queue: one invoice the check approves (after catching a missed fact), one no grant can pay
  const QUEUE = ["INV-02", "INV-14"].map(id => INVOICES.find(i => i.id === id));
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const WORDS = { allowed: "OK to pay", not_allowed: "Can't pay this way", needs_info: "Need more info", escalate: "Ask finance" };
  const FUND_NAME = { "SSVF-H": "SSVF", "COC-SSO-H": "HUD CoC services", "CHF-H": "County Housing Fund", "SSVF-D": "SSVF", "SSVF-V": "SSVF", "COC-SSO-V": "HUD CoC services", "RIDGE": "Ridgeline Foundation" };
  const CAT_NAME = { "TFA-Rent": "Rent", "TFA-Rent-Fees": "Rent fees", "TFA-Utility": "Utility bill", "TFA-Security-Deposit": "Security deposit", "TFA-Utility-Deposit": "Utility deposit", "TFA-Moving": "Moving costs", "TFA-GHSA": "Housing stability items", "SS-Case-Management": "Case management", "SS-Transportation": "Transportation", "SS-Legal": "Legal services", "Client-Flex": "Client flexible help", "Staff-Training": "Staff training", "Admin": "Administration" };
  const FIELDS = { fund: "Which grant pays", category: "Type of cost", cost_type: "Program or admin", service_period: "Service month" };
  const monthName = v => { const m = /^(\d{4})-(\d{2})$/.exec(v || ""); return m ? new Date(+m[1], +m[2] - 1, 1).toLocaleString("en-US", { month: "long", year: "numeric" }) : v; };
  const label = (k, v) => !v ? "" : k === "fund" ? (FUND_NAME[v] || v) : k === "category" ? (CAT_NAME[v] || v) : k === "service_period" ? monthName(v) : v;

  const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
  const ICON = {
    paperwork: svg('<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>'),
    person: svg('<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>'),
    count: svg('<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M8 13h2M14 13h2M8 17h2"/>'),
    history: svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
    doc: svg('<path d="M4 5a2 2 0 0 1 2-2h5v18H6a2 2 0 0 0-2 2z"/><path d="M20 5a2 2 0 0 0-2-2h-5v18h5a2 2 0 0 1 2 2z"/>'),
    write: svg('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13 7 4 4"/>'),
    pivot: svg('<path d="M4 7h12l-3-3M20 17H8l3 3"/>'),
    final: svg('<path d="m5 12.5 4.5 4.5L19 7.5"/>'),
    bad: svg('<path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/>'),
    flag: svg('<path d="M5 21V4h11l-2 4 2 4H5"/>'),
    allowed: svg('<circle cx="12" cy="12" r="10"/><path d="m7.5 12.5 3 3 6-6.5"/>'),
    not_allowed: svg('<circle cx="12" cy="12" r="10"/><path d="m8.5 8.5 7 7M15.5 8.5l-7 7"/>'),
    needs_info: svg('<circle cx="12" cy="12" r="10"/><path d="M12 7.5v5.5M12 16.5v.01"/>'),
    escalate: svg('<path d="M4 5h16v11H9l-5 4z"/><path d="M12 8.5v3M12 14v.01"/>')
  };
  const ERR = {
    not_granted: "Claude isn't allowed on this page yet. Allow it from the page's permissions, then reload.",
    sampling_disabled: "Claude isn't available for this account.",
    rate_limited: "Too many checks at once. Wait a minute, then run it again.",
    invalid_json: "The answer came back garbled. Run it again.",
    refused: "Claude declined this check.",
    session_expired: "Sign in again, then run it again."
  };

  const KEY = "gcc.demo.results";
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const keep = () => { try { localStorage.setItem(KEY, JSON.stringify(S.results)); } catch {} };
  const S = { sample: undefined, tools: false, run: null, results: load(), cur: null, error: null, drag: null };
  const curInv = () => QUEUE.find(i => i.id === S.cur) || null;

  (async () => {
    try { S.sample = window.claude && window.claude.use ? await window.claude.use("sample") : null; } catch { S.sample = null; }
    if (S.sample) { try { const l = await S.sample.limits(); S.tools = !!(l && l.tools); } catch { S.tools = false; } }
    render();
  })();

  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const monLabel = (m, i) => { const [y, mo] = m.split("-"); return MON[+mo - 1] + (i === 0 || mo === "01" ? " '" + y.slice(2) : ""); };
  function histStrip(h, fresh) {
    if (!h || !h.found) return "";
    const over = !h.within_limit, used = h.used_in_current_12_month_period;
    const cells = h.last_12_months.map((m, i) => {
      const now = m === h.this_invoice_month, paid = h.paid_months.includes(m);
      return `<div class="cell ${paid ? "paid" : ""} ${now ? "now" + (over ? " over" : "") : ""}" style="${fresh ? `animation-delay:${i * 70}ms` : ""}" title="${monthName(m)}: ${now ? "this invoice" : paid ? "paid by SSVF" : "not paid"}"></div>`;
    }).join("");
    const labs = h.last_12_months.map((m, i) => `<div class="mlab ${m === h.this_invoice_month ? "now" : ""}">${monLabel(m, i)}</div>`).join("");
    return `<div class="hist${fresh ? " grow" : ""}" role="img" aria-label="${used} of ${h.limit_per_12_months} ${h.assistance} months already paid in the last 12 months">
      <div class="hist-cap ${over ? "over" : "ok"}">${used} of ${h.limit_per_12_months} ${esc(h.assistance)} months used${over ? ". This month would go over the limit" : ". This month fits under the limit"}</div>
      <div class="cells">${cells}</div><div class="cells">${labs}</div>
      <div class="hlegend"><span><i class="paid"></i>Paid by SSVF</span><span><i></i>Not paid</span><span><i class="now ${over ? "" : "ok"}"></i>This invoice</span><span>Limit: ${h.limit_per_12_months} months in any 12 (${esc(String(h.income_level || "").toLowerCase())})</span></div>
    </div>`;
  }
  const srcClass = s => /eCFR/.test(s) ? "official" : /fake/.test(s) ? "fakedoc" : "";
  const CAT = { paperwork: "check", count: "check", person: "vet", history: "vet", doc: "rule", final: "rule", write: "claude", pivot: "pivot" };
  const CAT_LABEL = { check: "Page check", vet: "Veteran record", rule: "Rules", claude: "Claude", pivot: "Change of path" };
  const finding = e => e.state !== "done" ? "" : /^(Paperwork problem|SSVF .* limit reached|Over a limit)/.test(e.title) ? " find-bad" : /^(Paperwork complete|Within the SSVF|All limits OK)/.test(e.title) ? " find-ok" : "";
  const step = e => { const c = CAT[e.kind] || "claude"; return `<li class="cat-${c} st-${e.state || "done"}${e.kind === "final" && e.state !== "error" ? " st-final" : ""}${e.kind === "pivot" && e.data && e.data.next_fund === "none" ? " dead" : ""}${finding(e)}${e.fresh ? " enter" : ""}"><span class="ic">${e.state === "error" ? ICON.bad : ICON[e.kind] || ICON.final}</span><div class="sb"><span class="cat">${CAT_LABEL[c]}</span><div class="t">${esc(e.title)}${e.source ? e.source.split(" · ").map(x => `<span class="src ${srcClass(x)}">${esc(x)}</span>`).join("") : ""}</div>${e.why ? `<div class="why"><b>Why:</b> ${esc(e.why)}</div>` : ""}${e.kind === "history" && e.data && e.data.found ? histStrip(e.data, e.grow) : e.detail ? `<div class="d">${e.kind === "pivot" ? "<b>Because:</b> " : ""}${esc(e.detail)}</div>` : ""}${e.quote ? `<blockquote class="tq">"${esc(e.quote)}"<span class="${e.found ? "found" : "notfound"}">${e.found ? "Matches the source text word for word" : "Not found in the source. Read the rule yourself"}</span></blockquote>` : ""}</div></li>`; };

  // One step at a time: a step appears, waits for its own result, shows the result (text, chart or quote),
  // and stays alone on screen for a reading pause before the next step appears.
  const PACE = 1600, RESULT_DELAY = 700;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  let queue = [], pumping = null;
  const dwell = e => PACE + (e.data || e.quote ? 1400 : 0) + Math.min(String(e.detail || "").length * 12, 1200) + (e.why ? 600 : 0);
  function show(ev) {
    if (!S.run) return false;
    const t = S.run.trace, i = t.findIndex(e => e.id === ev.id);
    const grows = !!ev.data && !(i >= 0 && t[i].data);
    if (i >= 0) t[i] = { ...t[i], ...ev, grow: grows }; else t.push({ ...ev, fresh: true, grow: grows });
    const el = $("#trace"); if (el) { el.innerHTML = t.map(step).join(""); t.forEach(e => { e.fresh = false; e.grow = false; }); }
    return i < 0;
  }
  // Wait until this step's result is in the queue (or the run has ended), then take it out of the queue.
  async function resultFor(id) {
    for (;;) {
      const k = queue.findIndex(e => e.id === id && e.state && e.state !== "running");
      if (k >= 0) return queue.splice(k, 1)[0];
      if (!S.run || S.run.ended) return null;
      await sleep(100);
    }
  }
  // The first await makes pump() return before it can finish, so `pumping` is always assigned before it is cleared.
  async function pump() {
    await null;
    try {
      while (queue.length) {
        const ev = queue.shift();
        if (!show(ev)) continue;                       // update to a step already on screen: no pause
        let shown = S.run && S.run.trace.find(e => e.id === ev.id);
        if (ev.state === "running") {
          await sleep(RESULT_DELAY);
          const res = await resultFor(ev.id);
          if (res) { show(res); shown = S.run && S.run.trace.find(e => e.id === ev.id); }
        }
        await sleep(shown ? dwell(shown) : PACE);
      }
    } finally { pumping = null; }
  }
  function log(ev) { queue.push(ev); if (!pumping) pumping = pump(); }
  async function drain() { while (pumping) { try { await pumping; } catch { pumping = null; } } }

  async function check() {
    const INV = curInv();
    if (!INV || !S.sample || S.run) return;
    S.run = { id: INV.id, trace: [], t0: Date.now() }; S.error = null; queue = []; pumping = null;
    render();
    const timer = setInterval(() => { const el = $("#elapsed"); if (el && S.run) { const n = Math.round((Date.now() - S.run.t0) / 1000); el.textContent = n + (n === 1 ? " second" : " seconds"); } }, 1000);
    let writing = false;
    const onText = ({ text }) => { if (!writing && text.includes("{")) { writing = true; log({ id: "write", kind: "write", title: "Writing the answer for the analyst", state: "running" }); } };
    try {
      let r;
      if (S.tools) {
        log({ id: "plan", kind: "write", title: "Claude is deciding what to check", state: "running" });
        r = await S.sample.json(buildToolPrompt(INV, DOCS), { onText, tools: makeTools(INV, DOCS, ev => { log({ id: "plan", state: "done", title: "Claude planned the check" }); log(ev); }) });
      } else {
        oneShotSteps(INV).forEach((s, n) => log({ id: "pre" + n, ...s }));
        log({ id: "plan", kind: "write", title: "Claude is reading the rules", state: "running" });
        r = await S.sample.json(buildPrompt(INV, DOCS), { onText, cache: false });
        log({ id: "plan", state: "done", title: "Claude read the rules" });
      }
      if (!r || typeof r !== "object" || !r.status) throw { code: "invalid_json" };
      log({ id: "write", kind: "write", title: "Claude wrote the answer for the analyst", state: "done" });
      // One step per quote Claude used: the exact words, where they came from, and whether the page found them in the source
      const quotes = [r.deciding, ...(r.supporting || []).slice(0, 2)].filter(q => q && q.quote);
      quotes.forEach((q, n) => {
        const found = verifyQuote(q, DOCS);
        log({ id: "quote" + n, kind: "final", title: n === 0 ? "The rule that decides it" : "A supporting rule", source: DOC_SOURCE[q.doc] || "", detail: q.section || "", quote: q.quote, found, state: found ? "done" : "error" });
      });
      const ok = quotes.length ? verifyQuote(r.deciding, DOCS) : false;
      r.verified = ok; S.run.ended = true; await drain(); r.trace = S.run.trace.map(({ fresh, ...e }) => e); r.seconds = Math.round((Date.now() - S.run.t0) / 1000);
      S.results[INV.id] = r; keep();
    } catch (e) {
      if (e && e.code === "tools_unavailable") { S.tools = false; S.error = "Step-by-step mode isn't available here. Run it again for the quick check."; }
      else if (e && e.code !== "cancelled") S.error = ERR[e && e.code] || "The check didn't finish. Run it again.";
      if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) S.sample = null;
    } finally { if (S.run) S.run.ended = true; await drain(); clearInterval(timer); S.run = null; render(); }
  }

  function open(id) {
    if (S.run) return;
    S.cur = id; S.error = null; render();
    if (!S.results[id] && S.sample) check();
  }

  function statusText(r) {
    const sug = r && r.suggested;
    return r.status === "allowed" && sug && sug.fund ? `Pay from ${FUND_NAME[sug.fund] || sug.fund}` : WORDS[r.status] || r.status;
  }

  function renderQueue() {
    const waiting = QUEUE.filter(i => !S.results[i.id]).length;
    return `<section class="card"><div class="queue-head"><h2>Invoices to code</h2><span class="qcount">${waiting} waiting</span></div>
      <ul class="qlist">${QUEUE.map(i => {
        const r = S.results[i.id], running = S.run && S.run.id === i.id;
        const chip = running ? '<span class="chip c-run">Checking...</span>' : r ? `<span class="chip c-${esc(r.status)}">Checked: ${esc(statusText(r))}</span>` : '<span class="chip">Needs coding</span>';
        return `<li class="qrow ${S.cur === i.id ? "current" : ""} ${S.run ? "locked" : ""}" draggable="${S.run ? "false" : "true"}" data-id="${i.id}" tabindex="0" role="button" aria-label="Check ${esc(i.vendor)}, ${money(i.amount)}">
          <div class="qtop"><span>${esc(i.vendor)}</span><span class="num">${money(i.amount)}</span></div>
          <div class="qdesc">${esc(i.description)}</div>
          <div class="qmeta"><span>${esc(i.site)} site</span><span>${esc(i.id)}</span>${chip}</div></li>`;
      }).join("")}</ul>
      <p class="qhint">Drag an invoice into the check, or click it.</p>
    </section>`;
  }

  function render() {
    const INV = curInv();
    const html = INV ? renderTool(INV) : `<div class="drop" id="drop">${'<div>' + svg('<path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/>') + '<b>Drop an invoice here</b>Grant Coding Check reads the invoice, the veteran\'s history and the grant rules, then suggests the coding.</div>'}</div>`;
    $("#app").innerHTML = `<div class="col">${renderQueue()}</div><div class="col tool" id="tool">${html}</div>`;
    bind();
  }

  function bind() {
    document.querySelectorAll(".qrow").forEach(row => {
      const id = row.dataset.id;
      row.addEventListener("click", () => open(id));
      row.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(id); } });
      row.addEventListener("dragstart", e => { if (S.run) { e.preventDefault(); return; } S.drag = id; row.classList.add("dragging"); try { e.dataTransfer.setData("text/plain", id); e.dataTransfer.effectAllowed = "move"; } catch {} });
      row.addEventListener("dragend", () => { S.drag = null; row.classList.remove("dragging"); const t = $("#tool"); if (t) t.classList.remove("over"); });
    });
    const tool = $("#tool");
    tool.addEventListener("dragover", e => { if (!S.drag || S.run) return; e.preventDefault(); tool.classList.add("over"); });
    tool.addEventListener("dragleave", e => { if (!tool.contains(e.relatedTarget)) tool.classList.remove("over"); });
    tool.addEventListener("drop", e => { e.preventDefault(); tool.classList.remove("over"); let id = S.drag; try { id = e.dataTransfer.getData("text/plain") || id; } catch {} if (id && QUEUE.some(i => i.id === id)) open(id); });
    const b = $("#go"); if (b) b.addEventListener("click", check);
    const x = $("#reset"); if (x) x.addEventListener("click", () => { S.results = {}; S.cur = null; S.error = null; try { localStorage.removeItem(KEY); } catch {} render(); window.scrollTo(0, 0); });
  }

  function renderTool(INV) {
    const r = S.results[INV.id], sug = r && r.suggested ? r.suggested : null;
    const rows = Object.keys(FIELDS).map(k => {
      const entered = INV.analyst[k], sv = sug ? (sug[k] ?? null) : undefined, changed = sug && String(sv ?? "") !== String(entered ?? "");
      const ent = entered ? `<span class="${changed ? "was" : ""}">${esc(label(k, entered))}</span>` : '<span class="blank">Left blank</span>';
      return `<tr><th scope="row">${FIELDS[k]}</th><td>${ent}</td>${sug ? `<td><span class="use ${changed ? "changed" : ""}">${esc(sv ? label(k, sv) : k === "fund" ? "No grant can pay" : "None")}</span></td>` : ""}</tr>`;
    }).join("");
    const date = new Date(INV.date + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });

    let html = `<section class="card">
      <div class="inv-top"><p class="vendor">${esc(INV.vendor)}</p><span class="amount num">${money(INV.amount)}</span></div>
      <p class="desc">${esc(INV.description)}</p>
      <dl class="facts"><div><dt>Site</dt><dd>${esc(INV.site)}</dd></div><div><dt>Pay to</dt><dd>${esc(INV.payee)}</dd></div><div><dt>Veteran</dt><dd>${INV.client ? esc(INV.client) : "None"}</dd></div><div><dt>Invoice date</dt><dd class="num">${date}</dd></div></dl>
      <h2>${sug ? "Coding" : "Analyst's coding"}</h2>
      <table class="coding"><thead><tr><th>Field</th><th>Analyst entered</th>${sug ? "<th>Check suggests</th>" : ""}</tr></thead><tbody>${rows}</tbody></table>
      <div class="go">
        <button class="btn${r && !S.run ? " quiet" : ""}" id="go" type="button" ${S.sample && !S.run ? "" : "disabled"}>${S.run ? "Checking..." : r ? "Run again" : "Run grant check"}</button>
        ${!S.run && (Object.keys(S.results).length || S.error) ? '<button class="btn quiet" id="reset" type="button">Reset demo</button>' : ""}
        ${S.sample === null ? '<span class="hint">Open this page on claude.ai to run the check.</span>' : S.sample === undefined ? '<span class="hint">Getting ready...</span>' : ""}
      </div>
    </section>`;

    const live = S.run && S.run.id === INV.id;
    const trace = live ? S.run.trace : r && r.trace;
    if (live || (trace && trace.length)) html += `<section class="card"><h2>What the check looked at</h2><div class="tlegend">${["rule","vet","check","claude","pivot"].map(c => `<span><i style="background:var(--c-${c})"></i>${CAT_LABEL[c]}</span>`).join("")}</div><ol class="trace" id="trace" aria-live="polite">${trace.map(step).join("")}</ol>${live ? '<p class="elapsed" id="elapsed">0 seconds</p>' : r && r.seconds ? `<p class="elapsed">Took ${r.seconds} seconds</p>` : ""}</section>`;

    if (S.error) html += `<section class="card"><p class="err">${esc(S.error)}${r ? " The last answer is still below." : ""}</p></section>`;

    if (r && !live) {
      const what = statusText(r);
      const missed = Array.isArray(r.missed) ? r.missed.slice(0, 3) : [];
      const d = r.deciding || {};
      html += `<section class="card" aria-live="polite">
        <div class="verdict v-${esc(r.status)}">${ICON[r.status] || ""}<div><p class="what">${esc(what)}</p><p>${esc(r.summary)}</p></div></div>
        ${missed.length ? `<h3>What the check caught</h3><ul class="missed">${missed.map(m => `<li>${ICON.flag}<span>${esc(m)}</span></li>`).join("")}</ul>` : ""}
        ${r.question ? `<p><b>Question for finance:</b> ${esc(r.question)}</p>` : ""}
        ${d.quote ? `<details><summary>The rule behind this</summary><blockquote><div class="qsrc"><b>${esc(d.section || d.doc)}</b><span class="${r.verified ? "found" : "notfound"}">${r.verified ? "Matches the source text" : "Not found in the source"}</span></div>${esc(d.quote)}</blockquote>${r.precedence ? `<p class="why"><b>Why this rule wins:</b> ${esc(r.precedence)}</p>` : ""}</details>` : ""}
      </section>`;
    }

    return html;
  }
  render();
})();
</script>
